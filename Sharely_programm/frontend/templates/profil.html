<!doctype html>
<!-- Mockup „Desktop · Mein Profil (Overlay)“. Beispieldaten: Das Modul nutzer hat noch kein Backend. -->
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sharely – Mein Profil</title>
  <link rel="stylesheet" href="../static/css/stil.css">
  <script src="../static/js/gemeinsam.js"></script>
</head>
<body>
<main class="seite">
  <section class="fenster" style="max-width: 820px">
    <header class="fenster-kopf">
      <h2>Mein Profil</h2>
      <a class="symbolknopf" href="hauptmenue.html" aria-label="Schließen, zum Hauptmenü" data-symbol="schliessen"></a>
    </header>
    <div class="profil-kopf">
      <div class="bild">
        <span class="initiale gross" id="initiale"></span>
        <button type="button" class="symbolknopf" disabled title="Kommt noch: Modul nutzer fehlt" aria-label="Profilbild ändern" data-symbol="kamera"></button>
      </div>
      <div>
        <h2 id="name"></h2>
        <p>Mitglied seit Oktober 2026</p>
        <button type="button" class="knopf-rand gruen klein" disabled title="Kommt noch: Modul nutzer fehlt">Bild hinzufügen</button>
      </div>
    </div>
    <a class="menue-zeile" href="anmeldung.html"><span data-symbol="personWechsel"></span> Nutzer wechseln <span class="pfeil" data-symbol="weiter"></span></a>
    <button type="button" class="menue-zeile gefahr" disabled title="Kommt noch: Modul nutzer fehlt"><span data-symbol="muell"></span> Account löschen</button>
  </section>
</main>

<script>
  seitenkopf(`Hallo ${NUTZER.name}!`);
  document.getElementById("initiale").textContent = NUTZER.name[0];
  document.getElementById("name").textContent = NUTZER.name;
</script>
</body>
</html>
