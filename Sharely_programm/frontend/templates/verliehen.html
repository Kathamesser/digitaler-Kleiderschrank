<!doctype html>
<!-- Mockup „Freunde-Leih Verleihansicht“ (dort für einen Freund, hier für alle Freunde).
     Beispieldaten: Das Modul verleihen hat noch kein Backend. -->
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sharely – Leihen</title>
  <link rel="stylesheet" href="../static/css/stil.css">
  <script src="../static/js/gemeinsam.js"></script>
</head>
<body>
<main class="seite">
  <div class="fenster inhalt-wachsen">
    <header class="fenster-kopf">
      <h2><span>Leihen mit deinen Freunden<small>Was du dir geliehen und was du verliehen hast</small></span></h2>
    </header>
    <div class="hinweis">Beispieldaten: Verleihen und Verschenken haben noch kein Backend.</div>
    <div class="leih-spalten">
      <section class="leih-spalte geliehen">
        <header><span class="weiss-rund" data-symbol="links"></span>
          <div><h2>Von dir geliehen</h2><p>Teile von Freunden, die gerade bei dir sind</p></div><b id="anzahl-geliehen"></b></header>
        <div id="geliehen"></div>
      </section>
      <section class="leih-spalte verliehen">
        <header><span class="weiss-rund" data-symbol="rechts"></span>
          <div><h2>Von dir verliehen</h2><p>Deine Teile, die gerade bei Freunden sind</p></div><b id="anzahl-verliehen"></b></header>
        <div id="verliehen"></div>
      </section>
    </div>
  </div>
</main>

<script>
  seitenkopf("Leihen");
  fussleiste([
    { text: "Hauptmenü", symbol: "haus", href: "hauptmenue.html" },
    { text: "Zu den Freunden", symbol: "person", href: "freunde.html", art: "knopf-dunkel" },
  ]);

  // frist: ok = Rückgabedatum in der Zukunft, offen = unbefristet, ueberfaellig
  const BEISPIELE = {
    geliehen: [
      { titel: "Lederjacke", text: "Jacken · von Lena · seit 02.10.2026", frist: "ok", fristText: "bis 24.10.2026", ton: "ton-gelb" },
      { titel: "Seidenschal", text: "Accessoires · von Lena · seit 20.09.2026", frist: "offen", fristText: "unbefristet", ton: "ton-minze" },
    ],
    verliehen: [
      { titel: "Wintermantel", text: "Jacken · an Lena · seit 01.10.2026", frist: "ueberfaellig", fristText: "überfällig · 15.10.2026", ton: "ton-rosa" },
      { titel: "Handtasche", text: "Accessoires · an Jonas · seit 05.10.2026", frist: "offen", fristText: "unbefristet", ton: "ton-beige" },
    ],
  };

  for (const [art, liste] of Object.entries(BEISPIELE)) {
    document.getElementById(`anzahl-${art}`).textContent = liste.length;
    document.getElementById(art).replaceChildren(...liste.map((e) => {
      const zeile = document.createElement("div");
      zeile.className = "leih-eintrag";
      zeile.innerHTML = `<span class="vorschau ${e.ton}">${SYMBOL.buegel}</span><span class="text"><strong></strong><small></small></span>
        <span class="frist ${e.frist}">${SYMBOL.kalender} <span></span></span>${SYMBOL.weiter}`;
      zeile.querySelector("strong").textContent = e.titel;
      zeile.querySelector("small").textContent = e.text;
      zeile.querySelector(".frist span").textContent = e.fristText;
      return zeile;
    }));
  }
</script>
</body>
</html>
