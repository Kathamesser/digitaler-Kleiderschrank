<!doctype html>
<!-- Mockups „Desktop · Kleiderschrank“ und „Desktop · Kleidung filtern (Overlay)“. Daten live aus GET /api/kleidung.
     Filter im Aufbau des Mockups (Entscheidung Katha, 20.10.2026) mit den Feldern des ERM vom 20.10.2026. -->
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sharely – Kleiderschrank</title>
  <link rel="stylesheet" href="../static/css/stil.css">
  <script src="../static/js/gemeinsam.js"></script>
</head>
<body>
<main class="seite">
  <div class="werkzeugleiste">
    <label class="suche">
      <span data-symbol="lupe"></span>
      <input type="search" id="suche" placeholder="Im Schrank suchen" aria-label="Im Schrank suchen">
    </label>
    <a class="knopf" href="kleidung-hochladen.html"><span data-symbol="plus"></span> Kleidungsstück hinzufügen</a>
  </div>

  <div class="chips">
    <button type="button" class="chip" id="alles">Alles</button>
    <button type="button" class="chip" id="filterknopf" aria-haspopup="dialog" aria-controls="filterblatt">
      <span data-symbol="filter"></span> Filter <span class="zahl" id="filterzahl" hidden></span>
    </button>
  </div>

  <div class="inhalt-wachsen">
    <div id="meldung" class="meldung" role="status"></div>
    <div class="raster" id="raster"></div>

    <div class="leer" id="leer" hidden>
      <div class="kachel ton-beige" data-symbol="buegel"></div>
      <strong>Noch keine Kleidungsstücke</strong>
      <p>Füge dein erstes Teil hinzu.</p>
      <a class="knopf" href="kleidung-hochladen.html"><span data-symbol="plus"></span> Kleidungsstück hinzufügen</a>
    </div>
  </div>
</main>

<dialog class="blatt" id="filterblatt" aria-labelledby="filtertitel">
  <form id="filterformular" method="dialog">
    <header class="blatt-kopf">
      <h2 id="filtertitel"><span data-symbol="filter"></span>Kleidung filtern</h2>
      <button type="button" class="symbolknopf" id="filter-schliessen" aria-label="Filter schließen" data-symbol="schliessen"></button>
    </header>
    <div class="blatt-inhalt">
      <label class="schalter-kasten">
        <span data-symbol="herz"></span>
        <span class="text"><strong>Favorit</strong> – nur Lieblingsstücke anzeigen</span>
        <span class="schalter"><input type="checkbox" name="favorit" value="true"><span class="bahn"></span></span>
      </label>
      <label class="schalter-kasten">
        <span data-symbol="schloss"></span>
        <span class="text"><strong>Privat</strong> – nur Teile anzeigen, die Freunde nicht sehen</span>
        <span class="schalter"><input type="checkbox" name="privat" value="true"><span class="bahn"></span></span>
      </label>

      <div class="farb-zeile">
        <span class="titel">Farbe<small data-zaehler="farbe" data-leer="mehrere"></small></span>
        <div class="farben" id="f-farbe"></div>
      </div>

      <div class="auswahl-spalten">
        <div>
          <div class="filter-titel"><span class="titel">Kleidungsart</span><small data-zaehler="kleidungsart" data-leer="eine Auswahl"></small></div>
          <div class="auswahlliste" id="f-kleidungsart"></div>
        </div>
        <div title="Kommt mit dem Modul Kategorien">
          <div class="filter-titel"><span class="titel">Kategorie</span><small>folgt</small></div>
          <div class="auswahlliste" id="f-kategorie"></div>
        </div>
        <div>
          <div class="filter-titel"><span class="titel">Material</span><small data-zaehler="material" data-leer="mehrere"></small></div>
          <div class="auswahlliste" id="f-material"></div>
        </div>
        <div>
          <div class="filter-titel"><span class="titel">Saison</span><small data-zaehler="saison" data-leer="mehrere"></small></div>
          <div class="auswahlliste" id="f-saison"></div>
        </div>
      </div>

      <div class="status-zeile">
        <span class="titel">Status</span>
        <div class="pillen" id="f-status"></div>
      </div>

      <div class="zeile">
        <div>
          <span class="titel">Kaufdatum</span>
          <div class="von-bis">
            <span>von</span><input type="date" name="kauf_von" aria-label="Gekauft ab">
            <span>bis</span><input type="date" name="kauf_bis" aria-label="Gekauft bis">
          </div>
        </div>
        <div>
          <span class="titel">Preis</span>
          <div class="von-bis">
            <span>von</span><input type="number" name="preis_von" min="0" step="0.01" inputmode="decimal" placeholder="0,00 €" aria-label="Preis von">
            <span>bis</span><input type="number" name="preis_bis" min="0" step="0.01" inputmode="decimal" placeholder="0,00 €" aria-label="Preis bis">
          </div>
        </div>
      </div>
    </div>
    <footer class="blatt-fuss">
      <button type="button" class="knopf-rand" id="filter-zuruecksetzen"><span data-symbol="ruecksetzen"></span> Zurücksetzen</button>
      <button type="submit" class="knopf"><span data-symbol="ok"></span> <span id="filter-zeigen">Filter anwenden</span></button>
    </footer>
  </form>
</dialog>

<script>
  seitenkopf("Mein Kleiderschrank");
  fussleiste([
    { text: "Hauptmenü", symbol: "haus", href: "hauptmenue.html" },
    { text: "Garderobe", symbol: "buegel", href: "outfits.html", art: "knopf-dunkel" },
  ]);

  const raster = document.getElementById("raster");
  const leer = document.getElementById("leer");
  const meldung = document.getElementById("meldung");
  const suche = document.getElementById("suche");
  const blatt = document.getElementById("filterblatt");
  const formular = document.getElementById("filterformular");
  const filterzahl = document.getElementById("filterzahl");
  const filterknopf = document.getElementById("filterknopf");
  const alles = document.getElementById("alles");
  let alle = [];
  let geladen = false;

  // Bestätigung nach dem Hinzufügen (User Story 8), kommt von kleidung-hochladen.html
  const neu = new URLSearchParams(location.search).get("neu");
  if (neu) {
    zeigeMeldung(meldung, `${neu} wurde deinem Kleiderschrank hinzugefügt.`, "ok");
    history.replaceState(null, "", "schrank.html");
  }

  // ---------- Filter-Fenster ----------

  const LISTEN = ["farbe", "material", "saison", "status"];

  farbkreise("f-farbe", "farbe", "checkbox");
  pillen("f-kleidungsart", "kleidungsart", { alle: "Alle", ...KLEIDUNGSARTEN }, "radio");
  formular.querySelector('[name="kleidungsart"][value="alle"]').defaultChecked = true; // Zurücksetzen springt hierhin
  // Kategorien: nur zur Ansicht, bis es das Modul Kategorien (kategorie_ids → Namen) gibt
  pillen("f-kategorie", "kategorie", Object.fromEntries(KATEGORIEN_VORGABE.map((k) => [k, k])), "checkbox");
  for (const f of formular.querySelectorAll('[name="kategorie"]')) f.disabled = true;
  pillen("f-material", "material", MATERIALIEN, "checkbox");
  pillen("f-saison", "saison", SAISONS, "checkbox");
  for (const { wert, text, symbol } of STATUS) {
    const label = document.createElement("label");
    label.innerHTML = `<input type="checkbox" name="status" value="${wert}"><span>${SYMBOL[symbol]} ${text}</span>`;
    document.getElementById("f-status").append(label);
  }
  const heute = new Date().toISOString().slice(0, 10);
  for (const name of ["kauf_von", "kauf_bis"]) formular.elements[name].max = heute;

  /** Aktuelle Auswahl im Filter. Leere Liste, "alle" bzw. null = kein Filter. */
  function kriterien() {
    const daten = new FormData(formular);
    const f = { kleidungsart: daten.get("kleidungsart") || "alle" };
    for (const name of LISTEN) f[name] = daten.getAll(name);
    f.favorit = daten.has("favorit");
    f.privat = daten.has("privat");
    const zahl = (wert) => (wert === "" || wert === null ? null : Number(wert));
    f.preisVon = zahl(daten.get("preis_von"));
    f.preisBis = zahl(daten.get("preis_bis"));
    f.kaufVon = daten.get("kauf_von") || null;
    f.kaufBis = daten.get("kauf_bis") || null;
    return f;
  }

  /** Innerhalb einer Eigenschaft reicht ein Treffer (oder), zwischen Eigenschaften müssen alle passen (und).
   *  Teile ohne Angabe fallen raus, sobald nach dieser Eigenschaft gefiltert wird. */
  function passtZuFilter(k, f) {
    const eins = (auswahl, vorhanden) => !auswahl.length || auswahl.some((wert) => vorhanden.has(wert));
    if (f.kleidungsart !== "alle" && k.kleidungsart !== f.kleidungsart) return false;
    if (f.favorit && !k.favorit) return false;
    if (f.privat && !k.privat) return false;
    if (!eins(f.farbe, new Set([k.farbe]))) return false;
    if (!eins(f.material, new Set([k.material]))) return false;
    // Ganzjährige Teile passen zu jeder Saison, Filter „Ganzjährig“ findet nur ganzjährige Teile
    const saisons = new Set(k.saison.includes("ganzjaehrig") ? Object.keys(SAISONS) : k.saison);
    if (!eins(f.saison, saisons)) return false;
    // Status kommt vom Backend: geliehene Teile sind eigene Einträge mit status = geliehen (ERM, Regel 6)
    if (!eins(f.status, new Set([k.status]))) return false;
    if (f.preisVon !== null || f.preisBis !== null) {
      if (k.preis == null) return false;
      if (f.preisVon !== null && k.preis < f.preisVon) return false;
      if (f.preisBis !== null && k.preis > f.preisBis) return false;
    }
    if (f.kaufVon || f.kaufBis) {
      if (!k.kaufdatum) return false; // Datum als JJJJ-MM-TT, lässt sich als Text vergleichen
      if (f.kaufVon && k.kaufdatum < f.kaufVon) return false;
      if (f.kaufBis && k.kaufdatum > f.kaufBis) return false;
    }
    return true;
  }

  /** Wie viele Eigenschaften gerade filtern (Zahl am Filter-Knopf). */
  function anzahlAktiv(f) {
    return LISTEN.filter((name) => f[name].length).length + (f.kleidungsart !== "alle") + f.favorit + f.privat
      + (f.preisVon !== null || f.preisBis !== null) + Boolean(f.kaufVon || f.kaufBis);
  }

  /** „2 gewählt“ bzw. „mehrere“ / „eine Auswahl“ neben den Überschriften. */
  function zaehlerSetzen(f) {
    for (const el of formular.querySelectorAll("[data-zaehler]")) {
      const name = el.dataset.zaehler;
      const n = name === "kleidungsart" ? Number(f.kleidungsart !== "alle") : f[name].length;
      el.textContent = n ? `${n} gewählt` : el.dataset.leer;
    }
  }

  filterknopf.onclick = () => blatt.showModal();
  document.getElementById("filter-schliessen").onclick = () => blatt.close();
  blatt.onclick = (e) => { if (e.target === blatt) blatt.close(); }; // Klick neben das Fenster
  formular.oninput = zeichne;
  const zuruecksetzen = () => { formular.reset(); zeichne(); };
  document.getElementById("filter-zuruecksetzen").onclick = zuruecksetzen;
  alles.onclick = zuruecksetzen; // „Alles“ = kein Filter
  suche.oninput = zeichne;

  function passtZurSuche(k) {
    const wort = suche.value.trim().toLowerCase();
    if (!wort) return true;
    const farbe = FARBEN.find((x) => x.wert === k.farbe);
    return [k.name, KLEIDUNGSARTEN[k.kleidungsart], KLEIDUNGSART_EINZAHL[k.kleidungsart], farbe && farbe.text, MATERIALIEN[k.material]]
      .some((feld) => feld && feld.toLowerCase().includes(wort));
  }

  function zeichne() {
    const f = kriterien();
    const anzahl = anzahlAktiv(f);
    filterzahl.textContent = anzahl;
    filterzahl.hidden = !anzahl;
    alles.classList.toggle("aktiv", anzahl === 0);
    filterknopf.setAttribute("aria-label", anzahl ? `Filter, ${anzahl} aktiv` : "Filter");
    zaehlerSetzen(f);

    const treffer = alle.filter((k) => passtZuFilter(k, f) && passtZurSuche(k));
    document.getElementById("filter-zeigen").textContent = anzahl ? `Filter anwenden (${anzahl})` : "Filter anwenden";
    raster.replaceChildren(...treffer.map((k) => kleidungsKarte(k)));
    leer.hidden = !geladen || alle.length > 0;
    if (alle.length && !treffer.length) raster.innerHTML = '<p class="leise">Nichts gefunden.</p>';
  }

  zeichne();
  holeJson("/kleidung")
    .then((liste) => { alle = liste; geladen = true; zeichne(); })
    .catch((fehler) => zeigeMeldung(meldung, fehler.message, "fehler"));
</script>
</body>
</html>
