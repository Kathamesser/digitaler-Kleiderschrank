<!doctype html>
<!-- Mockup „Desktop · Kleidungsstück – Detailansicht (Overlay)“. Daten live aus GET /api/kleidung/{id}.
     Verleihen/Verschenken öffnet das Fenster aus dem Mockup „Anfrage stellen – Leihen / Verschenken (Overlay)“ mit Beispiel-Freunden.
     Bearbeiten, Löschen, Favorit umschalten, Verleihen und Anprobieren haben noch kein Backend. -->
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sharely – Kleidungsstück</title>
  <link rel="stylesheet" href="../static/css/stil.css?v=2">
  <script src="../static/js/gemeinsam.js?v=2"></script>
  <script src="../static/js/beispieldaten.js?v=2"></script>
</head>
<body>
<main class="seite">
  <div id="meldung" class="meldung" role="status"></div>

  <article class="fenster" id="inhalt" hidden>
    <header class="fenster-kopf">
      <h2 id="titel">Kleidungsstück</h2>
      <button type="button" class="symbolknopf rosa" id="herz" disabled title="Kommt noch: Ändern-Endpunkt fehlt"></button>
      <a class="symbolknopf" href="schrank.html" aria-label="Schließen, zurück zum Schrank" data-symbol="schliessen"></a>
    </header>

    <div class="zwei-spalten">
      <div>
        <div class="grossbild" id="grossbild"><img id="bild" alt=""></div>
        <div class="status-zeile" style="border-top: 1.5px solid var(--linie); padding-top: 22px">
          <span class="titel">Status</span>
          <span class="marke-pille" id="status"></span>
        </div>
      </div>

      <div>
        <dl class="eigenschaften" id="eigenschaften"></dl>

        <details class="aufklapper" id="masse" hidden>
          <summary><span data-symbol="lineal"></span> Maße <span class="pfeil" data-symbol="unten"></span></summary>
          <div class="aufklapper-inhalt"><dl class="eigenschaften" id="masse-liste"></dl></div>
        </details>

        <!-- Noch ohne Backend: Avatar, Verleihen, Ändern, Löschen -->
        <button class="knopf-dunkel breit" style="margin-top: 30px" disabled title="Kommt mit dem 3D-Avatar"><span data-symbol="anprobieren"></span> Kleidung anprobieren</button>
        <div class="zeile" style="margin-top: 18px">
          <button type="button" class="knopf-rand gruen" id="verleihen"><span data-symbol="senden"></span> Verleihen / Verschenken</button>
          <button class="knopf-gefahr" disabled title="Kommt noch: Löschen-Endpunkt fehlt"><span data-symbol="muell"></span> Löschen</button>
        </div>
        <div style="display: flex; justify-content: flex-end; margin-top: 18px">
          <button class="knopf" disabled title="Kommt noch: Bearbeiten-Endpunkt fehlt"><span data-symbol="stift"></span> Bearbeiten</button>
        </div>
      </div>
    </div>
  </article>
</main>

<!-- Leihvorgang mit Typ, Empfänger, bis (leer = unbefristet) und Notiz (ERM Entscheidung 8); beim Verschenken wechselt
     nach dem Annehmen der Besitzer (ERM Entscheidung 4) -->
<dialog class="blatt" id="anfrage" aria-labelledby="a-titel">
  <form id="a-formular" method="dialog" novalidate>
    <header class="blatt-kopf">
      <button type="button" class="symbolknopf" data-schliessen aria-label="Zurück zum Kleidungsstück" data-symbol="zurueck"></button>
      <h2 id="a-titel">Anfrage senden</h2>
      <button type="button" class="symbolknopf" data-schliessen aria-label="Schließen" data-symbol="schliessen"></button>
    </header>
    <div class="blatt-inhalt">
      <div class="zeile" style="gap: 44px">
        <div>
          <div class="teil-kopf"><span class="vorschau" id="a-vorschau" data-symbol="buegel"></span><span><strong id="a-teil"></strong><small id="a-herkunft"></small></span></div>
          <div class="umschalter dunkel" role="radiogroup" style="margin-top: 22px">
            <button type="button" role="radio" data-typ="leihen"><span data-symbol="rechts"></span> Leihen</button>
            <button type="button" role="radio" data-typ="verschenken"><span data-symbol="geschenk"></span> Verschenken</button>
          </div>
          <div class="titel-zeile">
            <span class="titel">An wen?</span>
            <label class="suche"><span data-symbol="lupe"></span><input type="search" id="a-suche" placeholder="Freund suchen" aria-label="Freund suchen"></label>
          </div>
          <div class="wahl-liste" id="a-freunde"></div>
        </div>
        <div style="display: flex; flex-direction: column">
          <div id="a-rueckgabe">
            <span class="titel" style="margin-top: 0">Rückgabedatum</span>
            <input type="date" name="bis" aria-label="Rückgabedatum">
            <label class="haekchen"><input type="checkbox" name="unbefristet"> Ohne festes Rückgabedatum</label>
          </div>
          <label><span class="titel">Notiz <small style="display: inline">(optional)</small></span>
            <textarea name="notiz" maxlength="500" rows="5" placeholder="z. B. Bitte nur chemisch reinigen."></textarea></label>
          <div class="zusammenfassung" id="a-zusammenfassung" hidden></div>
          <div class="meldung" id="a-meldung" role="status"></div>
          <div class="zeile" style="grid-template-columns: 1fr 2fr; margin-top: auto; padding-top: 22px">
            <button type="button" class="knopf-rand" data-schliessen>Abbrechen</button>
            <button type="submit" class="knopf"><span data-symbol="senden"></span> Anfrage senden</button>
          </div>
        </div>
      </div>
    </div>
  </form>
</dialog>

<script>
  seitenkopf("Mein Kleiderschrank");

  const meldung = document.getElementById("meldung");
  const id = new URLSearchParams(location.search).get("id");

  const euro = new Intl.NumberFormat("de-DE", { style: "currency", currency: "EUR" });
  const datum = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit", year: "numeric" });

  /** Wert einer Zeile als Knoten: Text, Pillen oder eigener Inhalt. */
  const pille = (text, klasse = "") => {
    const el = document.createElement("span");
    el.className = `marke-pille ${klasse}`;
    el.textContent = text;
    return el;
  };

  function zeile(dl, name, inhalt, symbol) {
    const div = document.createElement("div");
    const dt = document.createElement("dt");
    if (symbol) dt.innerHTML = SYMBOL[symbol];
    dt.append(name);
    const dd = document.createElement("dd");
    dd.append(...(Array.isArray(inhalt) ? inhalt : [inhalt]));
    div.append(dt, dd);
    dl.append(div);
  }

  function zeige(k) {
    document.title = `Sharely – ${titelVon(k)}`;
    document.getElementById("titel").textContent = titelVon(k);
    const herz = document.getElementById("herz");
    herz.innerHTML = k.favorit ? SYMBOL.herzVoll : SYMBOL.herz;
    herz.setAttribute("aria-label", k.favorit ? "Favorit" : "Kein Favorit");

    const rahmen = document.getElementById("grossbild");
    rahmen.classList.add(tonVon(k.id));
    const bild = document.getElementById("bild");
    bild.src = bildUrl(k);
    bild.alt = titelVon(k);
    bild.onerror = () => { rahmen.innerHTML = SYMBOL.buegel; };

    const status = STATUS.find((s) => s.wert === k.status) || { symbol: "haus", text: k.status };
    document.getElementById("status").innerHTML = `${SYMBOL[status.symbol]} `;
    document.getElementById("status").append(status.text);

    // Wie im Mockup; nur ausgefüllte Angaben zeigen
    const dl = document.getElementById("eigenschaften");
    zeile(dl, "Kleidungsart", pille(KLEIDUNGSARTEN[k.kleidungsart]));
    // Namen der Kategorien gibt es erst mit dem Modul Kategorien, bis dahin nur die Anzahl
    if (k.kategorie_ids.length) {
      const p = pille(k.kategorie_ids.length === 1 ? "1 Kategorie" : `${k.kategorie_ids.length} Kategorien`, "etikett");
      p.insertAdjacentHTML("afterbegin", SYMBOL.etikett);
      zeile(dl, "Kategorien", p);
    }
    const farbe = FARBEN.find((f) => f.wert === k.farbe);
    if (farbe) {
      const punkt = document.createElement("span");
      punkt.className = "farbpunkt";
      punkt.style.background = farbe.farbe;
      zeile(dl, "Farbe", [punkt, farbe.text]);
    }
    if (k.saison.length) zeile(dl, "Saison", k.saison.map((s) => pille(SAISONS[s])));
    if (k.material) zeile(dl, "Material", pille(MATERIALIEN[k.material]));
    if (k.kaufdatum) {
      const kal = document.createElement("span");
      kal.innerHTML = SYMBOL.kalender;
      zeile(dl, "Kaufdatum", [kal.firstChild, datum(k.kaufdatum)]);
    }
    if (k.preis != null) zeile(dl, "Preis", euro.format(k.preis));
    const schalter = document.createElement("span");
    schalter.className = "schalter";
    schalter.innerHTML = `<input type="checkbox" disabled aria-label="Privat" ${k.privat ? "checked" : ""}><span class="bahn"></span>`;
    zeile(dl, "Privat", [schalter, k.privat ? "Nur für dich sichtbar" : "Für Freunde sichtbar"], "schloss");

    // Maße in der Reihenfolge der Messpunkte (von oben nach unten)
    const reihenfolge = Object.keys(MESSPUNKTE);
    const masse = [...k.masse].sort((a, b) => reihenfolge.indexOf(a.messpunkt) - reihenfolge.indexOf(b.messpunkt));
    for (const m of masse) {
      zeile(document.getElementById("masse-liste"), MESSPUNKTE[m.messpunkt] || m.messpunkt,
        `${m.wert_cm.toLocaleString("de-DE")} cm`);
    }
    document.getElementById("masse").hidden = !masse.length;

    // Verleihen und Verschenken gehen nur bei eigenen Teilen, die gerade im Schrank liegen
    const verleihen = document.getElementById("verleihen");
    verleihen.disabled = k.status !== "im_schrank";
    if (verleihen.disabled) verleihen.title = "Geht nur bei eigenen Teilen, die gerade im Schrank sind";
    verleihen.onclick = () => anfrageOeffnen(k);

    document.getElementById("inhalt").hidden = false;
  }

  // ---------- Fenster „Anfrage senden“ (noch ohne Backend: Modul verleihen fehlt) ----------

  const anfrage = document.getElementById("anfrage");
  const aFormular = document.getElementById("a-formular");
  const aMeldung = document.getElementById("a-meldung");
  fensterVerdrahten(anfrage);
  let teil = null;
  let typ = "leihen";
  aFormular.bis.min = new Date().toISOString().slice(0, 10);

  function zeigeFreundeZurWahl() {
    const wort = document.getElementById("a-suche").value.trim().toLowerCase();
    const gewaehlt = aFormular.querySelector("[name=empfaenger]:checked")?.value;
    document.getElementById("a-freunde").replaceChildren(...FREUNDE_BEISPIEL
      .filter((p) => p.name.toLowerCase().includes(wort))
      .map((p) => {
        const label = document.createElement("label");
        label.innerHTML = `<span class="initiale klein ${p.ton}"></span><span></span><input type="radio" name="empfaenger">`;
        label.querySelector(".initiale").textContent = p.name[0];
        label.querySelector("span + span").textContent = p.name;
        const radio = label.querySelector("input");
        radio.value = p.id;
        radio.checked = p.id === gewaehlt;
        radio.setAttribute("aria-label", p.name);
        return label;
      }));
  }

  /** „Leihanfrage an Lena: Wintermantel“ */
  function zusammenfassen() {
    const id = aFormular.querySelector("[name=empfaenger]:checked")?.value;
    const empfaenger = FREUNDE_BEISPIEL.find((p) => p.id === id);
    const box = document.getElementById("a-zusammenfassung");
    box.hidden = !empfaenger;
    if (!empfaenger) return;
    box.innerHTML = SYMBOL[typ === "leihen" ? "rechts" : "geschenk"];
    box.append(`${typ === "leihen" ? "Leihanfrage" : "Geschenk"} an ${empfaenger.name.split(" ")[0]}: ${titelVon(teil)}`);
  }

  function typSetzen(neu) {
    typ = neu;
    for (const knopf of anfrage.querySelectorAll("[data-typ]")) {
      knopf.classList.toggle("aktiv", knopf.dataset.typ === typ);
      knopf.setAttribute("aria-checked", knopf.dataset.typ === typ);
    }
    document.getElementById("a-rueckgabe").hidden = typ !== "leihen"; // Geschenke kommen nicht zurück
    zusammenfassen();
  }
  for (const knopf of anfrage.querySelectorAll("[data-typ]")) knopf.onclick = () => typSetzen(knopf.dataset.typ);
  document.getElementById("a-suche").oninput = zeigeFreundeZurWahl;
  aFormular.unbefristet.onchange = () => { aFormular.bis.disabled = aFormular.unbefristet.checked; if (aFormular.unbefristet.checked) aFormular.bis.value = ""; };
  aFormular.onchange = zusammenfassen;

  function anfrageOeffnen(k) {
    teil = k;
    aFormular.reset();
    aFormular.bis.disabled = false;
    aMeldung.textContent = "";
    document.getElementById("a-suche").value = "";
    document.getElementById("a-vorschau").className = `vorschau ${tonVon(k.id)}`;
    document.getElementById("a-teil").textContent = titelVon(k);
    document.getElementById("a-herkunft").textContent = `${KLEIDUNGSARTEN[k.kleidungsart]} · aus deinem Schrank`;
    zeigeFreundeZurWahl();
    typSetzen("leihen");
    anfrage.showModal();
  }

  aFormular.onsubmit = (e) => {
    e.preventDefault();
    if (!aFormular.querySelector("[name=empfaenger]:checked")) return zeigeMeldung(aMeldung, "Bitte auswählen, an wen die Anfrage geht.", "fehler");
    if (typ === "leihen" && !aFormular.bis.value && !aFormular.unbefristet.checked) {
      return zeigeMeldung(aMeldung, "Bitte ein Rückgabedatum wählen oder „Ohne festes Rückgabedatum“ ankreuzen.", "fehler");
    }
    zeigeMeldung(aMeldung, "Die Anfrage wäre jetzt gesendet. Das Backend-Modul verleihen fehlt noch.", "ok");
  };

  if (!id) zeigeMeldung(meldung, "Kein Kleidungsstück ausgewählt.", "fehler");
  else holeJson(`/kleidung/${encodeURIComponent(id)}`)
    .then(zeige)
    .catch((fehler) => zeigeMeldung(meldung, fehler.message, "fehler"));
</script>
</body>
</html>
