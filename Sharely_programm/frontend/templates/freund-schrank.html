<!doctype html>
<!-- Mockups „Desktop · Kleiderschrank eines Freundes“, „Kleidungsstück eines Freundes – Detailansicht (Overlay)“ und
     „Anfrage an Freund (Fenster)“. Aufruf: freund-schrank.html?freund=lena. Beispieldaten: Module freunde und verleihen fehlen.
     Zu sehen sind nur geteilte Teile (privat = false, ERM Entscheidung 10). Filter wie im eigenen Schrank (24.11.2026). -->
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sharely – Kleiderschrank eines Freundes</title>
  <link rel="stylesheet" href="../static/css/stil.css?v=2">
  <script src="../static/js/gemeinsam.js?v=2"></script>
  <script src="../static/js/beispieldaten.js?v=2"></script>
  <script src="../static/js/anfrage.js?v=2"></script>
</head>
<body>
<main class="seite">
  <div class="freund-leiste">
    <div class="freund-chip">
      <a class="symbolknopf" href="freunde.html" aria-label="Zurück zu den Freunden" data-symbol="zurueck"></a>
      <span class="initiale" id="f-initiale"></span>
      <span><strong id="f-name"></strong><small id="f-zahl"></small></span>
    </div>
    <label class="suche">
      <span data-symbol="lupe"></span>
      <input type="search" id="suche">
    </label>
  </div>

  <div class="chips">
    <button type="button" class="chip" id="alles">Alles</button>
    <button type="button" class="chip" id="nur-verfuegbare" aria-pressed="false">Nur verfügbare</button>
    <button type="button" class="chip" id="filterknopf" aria-haspopup="dialog" aria-controls="filterblatt">
      <span data-symbol="filter"></span> Filter <span class="zahl" id="filterzahl" hidden></span>
    </button>
    <!-- Weg zur Garderobe des Freundes: auf dem Handy führt die Freundesliste direkt hierher (24.11.2026) -->
    <a class="chip chip-weiter" id="zur-garderobe"><span data-symbol="buegel"></span> Garderobe</a>
  </div>

  <div class="inhalt-wachsen">
    <div class="hinweis">Beispieldaten: Freunde und Verleihen haben noch kein Backend.</div>
    <div class="raster" id="raster"></div>
  </div>
</main>

<!-- Filter wie in schrank.html (24.11.2026), mit den Eigenschaften, die geteilte Teile eines Freundes haben.
     Favorit, Privat, Preis und Kaufdatum gehören dem Besitzer und fehlen hier. Gleiche ids, damit die Handy-Regeln
     aus stil.css (#filterblatt …) auch hier greifen. -->
<dialog class="blatt" id="filterblatt" aria-labelledby="filtertitel">
  <form id="filterformular" method="dialog">
    <header class="blatt-kopf">
      <h2 id="filtertitel"><span data-symbol="filter"></span>Kleidung filtern</h2>
      <button type="button" class="symbolknopf" id="filter-schliessen" aria-label="Filter schließen" data-symbol="schliessen"></button>
    </header>
    <div class="blatt-inhalt">
      <div class="farb-zeile">
        <span class="titel">Farbe<small data-zaehler="farbe" data-leer="mehrere"></small></span>
        <div class="farben" id="f-farbe"></div>
      </div>

      <div class="auswahl-spalten">
        <div class="ganze-breite">
          <div class="filter-titel"><span class="titel">Kleidungsart</span><small data-zaehler="kleidungsart" data-leer="eine Auswahl"></small></div>
          <div class="auswahlliste" id="f-kleidungsart"></div>
        </div>
        <div class="ganze-breite">
          <div class="filter-titel"><span class="titel">Kategorie</span><small data-zaehler="kategorie" data-leer="mehrere"></small></div>
          <div class="auswahlliste" id="f-kategorie"></div>
        </div>
        <div>
          <div class="filter-titel"><span class="titel">Material</span><small data-zaehler="material" data-leer="mehrere"></small></div>
          <div class="auswahlliste" id="f-material"></div>
        </div>
        <div>
          <div class="filter-titel"><span class="titel">Saison</span><small data-zaehler="saison" data-leer="mehrere"></small></div>
          <div class="auswahlliste" id="f-saison"></div>
        </div>
      </div>

      <div class="status-zeile">
        <span class="titel">Verfügbarkeit</span>
        <div class="pillen" id="f-verfuegbarkeit"></div>
      </div>
    </div>
    <footer class="blatt-fuss">
      <button type="button" class="knopf-rand" id="filter-zuruecksetzen"><span data-symbol="ruecksetzen"></span> Zurücksetzen</button>
      <button type="submit" class="knopf"><span data-symbol="ok"></span> <span id="filter-zeigen">Filter anwenden</span><span id="filter-zeigen-kurz">Anwenden</span></button>
    </footer>
  </form>
</dialog>

<dialog class="blatt" id="detail" aria-labelledby="d-titel">
  <header class="blatt-kopf">
    <div class="titel-block">
      <h2 id="d-titel"></h2>
      <p class="herkunft"><span class="initiale mini" id="d-initiale"></span><span id="d-herkunft"></span></p>
    </div>
    <button type="button" class="symbolknopf" data-schliessen aria-label="Schließen" data-symbol="schliessen"></button>
  </header>
  <div class="blatt-inhalt">
    <div class="zwei-spalten">
      <div>
        <div class="grossbild" id="d-bild"></div>
        <div class="status-zeile" style="border-top: 1.5px solid var(--linie); padding-top: 22px">
          <span class="titel">Status</span><span class="punkt-marke" id="d-status"></span>
        </div>
      </div>
      <div>
        <dl class="eigenschaften" id="d-eigenschaften"></dl>
        <details class="aufklapper">
          <summary><span data-symbol="lineal"></span> Maße <span class="pfeil" data-symbol="unten"></span></summary>
          <div class="aufklapper-inhalt"><p class="leise" style="margin: 0">Beispieldaten ohne Maße.</p></div>
        </details>
        <div class="zeile" style="margin-top: 30px">
          <button type="button" class="knopf-dunkel" disabled title="Kommt mit dem 3D-Avatar"><span data-symbol="anprobieren"></span> Kleidung anprobieren</button>
          <button type="button" class="knopf" id="d-anfragen"><span data-symbol="links"></span> Ausleihen / Verschenken anfragen</button>
        </div>
      </div>
    </div>
  </div>
</dialog>

<script>
  const freund = freundAusAdresse();
  const wessen = genitiv(freund.name);
  seitenkopf(`${wessen} Kleiderschrank`);
  document.title = `Sharely – ${wessen} Kleiderschrank`;
  fussleiste([
    { text: "Hauptmenü", symbol: "haus", href: "hauptmenue.html" },
    { text: "Freunde", symbol: "freunde", href: "freunde.html", art: "knopf-gelb" },
    { text: `${wessen} Garderobe`, symbol: "buegel", href: `freund-garderobe.html?freund=${freund.id}` },
  ]);
  const zurGarderobe = document.getElementById("zur-garderobe");
  zurGarderobe.href = `freund-garderobe.html?freund=${freund.id}`;
  zurGarderobe.setAttribute("aria-label", `${wessen} Garderobe ansehen`);

  document.getElementById("f-initiale").className = `initiale ${freund.ton}`;
  document.getElementById("f-initiale").textContent = freund.name[0];
  document.getElementById("f-name").textContent = freund.name;
  document.getElementById("f-zahl").textContent = `${freund.teile} geteilte Teile`;
  const suche = document.getElementById("suche");
  suche.placeholder = `In ${wessen} Schrank suchen`;
  suche.setAttribute("aria-label", suche.placeholder);

  const nurVerfuegbare = document.getElementById("nur-verfuegbare");
  const alles = document.getElementById("alles");
  let nurFrei = false;

  function karte(t) {
    const k = document.createElement("button");
    k.type = "button";
    k.className = `karte ${t.verfuegbarkeit === "verliehen" ? "ausgegraut" : ""}`;
    k.innerHTML = `<div class="kachel ${t.ton}">${SYMBOL.buegel}</div><strong></strong><small></small>
      <span class="punkt-marke ${t.verfuegbarkeit}">${VERFUEGBARKEIT[t.verfuegbarkeit]}</span>`;
    k.querySelector("strong").textContent = t.name;
    k.querySelector("small").textContent = KLEIDUNGSARTEN[t.kleidungsart];
    k.onclick = () => zeigeDetail(t);
    return k;
  }

  // ---------- Filter-Fenster (wie in schrank.html) ----------

  const blatt = document.getElementById("filterblatt");
  const formular = document.getElementById("filterformular");
  const filterknopf = document.getElementById("filterknopf");
  const filterzahl = document.getElementById("filterzahl");
  const LISTEN = ["farbe", "kategorie", "material", "saison", "verfuegbarkeit"];

  farbkreise("f-farbe", "farbe", "checkbox");
  pillen("f-kleidungsart", "kleidungsart", { alle: "Alle", ...KLEIDUNGSARTEN }, "radio");
  formular.querySelector('[name="kleidungsart"][value="alle"]').defaultChecked = true; // Zurücksetzen springt hierhin
  // Geteilte Teile eines Freundes tragen in den Beispieldaten die Kategorie-Namen, deshalb hier schon filterbar
  pillen("f-kategorie", "kategorie", Object.fromEntries(KATEGORIEN_VORGABE.map((k) => [k, k])), "checkbox");
  pillen("f-material", "material", MATERIALIEN, "checkbox");
  pillen("f-saison", "saison", SAISONS, "checkbox");
  pillen("f-verfuegbarkeit", "verfuegbarkeit", VERFUEGBARKEIT, "checkbox");

  function kriterien() {
    const daten = new FormData(formular);
    const f = { kleidungsart: daten.get("kleidungsart") || "alle" };
    for (const name of LISTEN) f[name] = daten.getAll(name);
    return f;
  }

  /** Innerhalb einer Eigenschaft reicht ein Treffer (oder), zwischen Eigenschaften müssen alle passen (und). */
  function passtZuFilter(t, f) {
    const eins = (auswahl, vorhanden) => !auswahl.length || auswahl.some((wert) => vorhanden.has(wert));
    if (f.kleidungsart !== "alle" && t.kleidungsart !== f.kleidungsart) return false;
    if (!eins(f.farbe, new Set([t.farbe]))) return false;
    if (!eins(f.kategorie, new Set(t.kategorien))) return false;
    if (!eins(f.material, new Set([t.material]))) return false;
    // Ganzjährige Teile passen zu jeder Saison, Filter „Ganzjährig“ findet nur ganzjährige Teile
    const saisons = new Set(t.saison.includes("ganzjaehrig") ? Object.keys(SAISONS) : t.saison);
    if (!eins(f.saison, saisons)) return false;
    if (!eins(f.verfuegbarkeit, new Set([t.verfuegbarkeit]))) return false;
    return true;
  }

  const anzahlAktiv = (f) => LISTEN.filter((name) => f[name].length).length + (f.kleidungsart !== "alle");

  function zaehlerSetzen(f) {
    for (const el of formular.querySelectorAll("[data-zaehler]")) {
      const name = el.dataset.zaehler;
      const n = name === "kleidungsart" ? Number(f.kleidungsart !== "alle") : f[name].length;
      el.textContent = n ? `${n} gewählt` : el.dataset.leer;
    }
  }

  filterknopf.onclick = () => blatt.showModal();
  document.getElementById("filter-schliessen").onclick = () => blatt.close();
  blatt.onclick = (e) => { if (e.target === blatt) blatt.close(); }; // Klick neben das Fenster
  formular.oninput = zeichne;
  document.getElementById("filter-zuruecksetzen").onclick = () => { formular.reset(); zeichne(); };

  function passtZurSuche(t) {
    const wort = suche.value.trim().toLowerCase();
    if (!wort) return true;
    const farbe = FARBEN.find((x) => x.wert === t.farbe);
    return [t.name, KLEIDUNGSARTEN[t.kleidungsart], farbe && farbe.text, MATERIALIEN[t.material], ...t.kategorien]
      .some((feld) => feld && feld.toLowerCase().includes(wort));
  }

  function zeichne() {
    const f = kriterien();
    const anzahl = anzahlAktiv(f);
    filterzahl.textContent = anzahl;
    filterzahl.hidden = !anzahl;
    filterknopf.setAttribute("aria-label", anzahl ? `Filter, ${anzahl} aktiv` : "Filter");
    zaehlerSetzen(f);
    document.getElementById("filter-zeigen").textContent = anzahl ? `Filter anwenden (${anzahl})` : "Filter anwenden";
    document.getElementById("filter-zeigen-kurz").textContent = anzahl ? `Anwenden (${anzahl})` : "Anwenden"; // Handy

    const treffer = FREUND_TEILE_BEISPIEL.filter((t) =>
      (!nurFrei || t.verfuegbarkeit === "verfuegbar") && passtZuFilter(t, f) && passtZurSuche(t));
    document.getElementById("raster").replaceChildren(...treffer.map(karte));
    if (!treffer.length) document.getElementById("raster").innerHTML = '<p class="leise">Nichts gefunden.</p>';
    alles.classList.toggle("aktiv", !nurFrei && anzahl === 0);
    nurVerfuegbare.classList.toggle("aktiv", nurFrei);
    nurVerfuegbare.setAttribute("aria-pressed", nurFrei);
  }
  suche.oninput = zeichne;
  // „Alles“ = kein Filter, keine Suche
  alles.onclick = () => { nurFrei = false; suche.value = ""; formular.reset(); zeichne(); };
  nurVerfuegbare.onclick = () => { nurFrei = !nurFrei; zeichne(); };

  // ---------- Detail-Fenster ----------

  const detail = document.getElementById("detail");
  fensterVerdrahten(detail);

  function zeile(dl, name, inhalt) {
    const div = document.createElement("div");
    div.innerHTML = "<dt></dt><dd></dd>";
    div.querySelector("dt").textContent = name;
    div.querySelector("dd").append(...inhalt);
    dl.append(div);
  }
  const pille = (text) => Object.assign(document.createElement("span"), { className: "marke-pille", textContent: text });

  function zeigeDetail(t) {
    document.getElementById("d-titel").textContent = t.name;
    document.getElementById("d-initiale").className = `initiale mini ${freund.ton}`;
    document.getElementById("d-initiale").textContent = freund.name[0];
    document.getElementById("d-herkunft").textContent = `aus ${wessen} Kleiderschrank`;
    const bild = document.getElementById("d-bild");
    bild.className = `grossbild ${t.ton}`;
    bild.innerHTML = SYMBOL.buegel;
    const status = document.getElementById("d-status");
    status.className = `punkt-marke ${t.verfuegbarkeit}`;
    status.textContent = VERFUEGBARKEIT[t.verfuegbarkeit];

    const dl = document.getElementById("d-eigenschaften");
    dl.replaceChildren();
    zeile(dl, "Kleidungsart", [pille(KLEIDUNGSARTEN[t.kleidungsart])]);
    zeile(dl, "Kategorien", t.kategorien.map(pille));
    zeile(dl, "Saison", t.saison.map((s) => pille(SAISONS[s])));
    zeile(dl, "Material", [pille(MATERIALIEN[t.material])]);
    const farbe = FARBEN.find((f) => f.wert === t.farbe);
    const punkt = Object.assign(document.createElement("span"), { className: "farbpunkt" });
    punkt.style.background = farbe.farbe;
    zeile(dl, "Farbe", [punkt, farbe.text]);

    // Anfragen geht nur, wenn das Teil gerade bei der Freundin liegt
    const anfragen = document.getElementById("d-anfragen");
    anfragen.disabled = t.verfuegbarkeit !== "verfuegbar";
    anfragen.title = t.verfuegbarkeit === "bei_dir" ? "Das Teil ist schon bei dir" : t.verfuegbarkeit === "verliehen" ? "Gerade verliehen" : "";
    anfragen.onclick = () => anfrageOeffnen(freund, t);
    detail.showModal();
  }

  zeichne();
</script>
</body>
</html>
