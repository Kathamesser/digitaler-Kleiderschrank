<!doctype html>
<!-- Mockups „Desktop · Freunde“ und „Freund hinzufügen (Fenster)“. Beispieldaten (beispieldaten.js): Das Modul freunde hat noch kein Backend.
     Abweichung vom Desktop-Mockup (Wunsch Katha, 24.11.2026): keine Freund-Ansicht neben der Liste, ein Klick auf einen
     Freund öffnet wie auf dem Handy direkt freund-schrank.html (von dort weiter zur Garderobe). -->
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sharely – Freunde</title>
  <link rel="stylesheet" href="../static/css/stil.css?v=2">
  <script src="../static/js/gemeinsam.js?v=2"></script>
  <script src="../static/js/beispieldaten.js?v=2"></script>
</head>
<body>
<main class="seite">
  <div class="werkzeugleiste">
    <label class="suche">
      <span data-symbol="lupe"></span>
      <input type="search" id="suche" placeholder="Freunde suchen" aria-label="Freunde suchen">
    </label>
    <button type="button" class="knopf" id="hinzufuegen" aria-label="Freund hinzufügen"><span data-symbol="personPlus"></span> <span class="handy-lang">Freund hinzufügen</span></button>
  </div>

  <div class="hinweis">Beispieldaten: Freunde haben noch kein Backend. Die Knöpfe ändern nur die Anzeige.</div>

  <div class="freunde-bereich inhalt-wachsen">
    <div>
      <section class="weisse-karte" id="anfragen-karte">
        <div class="karte-kopf"><h2>Anfragen</h2><span class="neu-marke" id="anfragen-zahl"></span></div>
        <div id="anfragen"></div>
      </section>
      <section class="weisse-karte">
        <div class="karte-kopf"><h2>Freundesliste</h2><small id="freunde-zahl"></small></div>
        <ul class="freundesliste" id="freunde"></ul>
      </section>
    </div>
  </div>
</main>

<dialog class="blatt klein" id="hinzufuegen-fenster" aria-labelledby="hinzufuegen-titel">
  <form id="hinzufuegen-formular" method="dialog" novalidate>
    <header class="blatt-kopf">
      <h2 id="hinzufuegen-titel">Freund hinzufügen</h2>
      <button type="button" class="symbolknopf" data-schliessen aria-label="Schließen" data-symbol="schliessen"></button>
    </header>
    <div class="blatt-inhalt">
      <label><span class="titel" style="margin-top: 0">Nutzername</span>
        <input type="text" name="nutzername" autocomplete="off" placeholder="z. B. AnnaK"></label>
      <div class="info-kasten"><span data-symbol="info"></span>
        <span>Gib den <strong>Nutzernamen</strong> deiner Freundin oder deines Freundes ein. Jeder Name ist bei Sharely nur einmal vergeben.</span></div>
      <div class="treffer" id="treffer" hidden>
        <span class="initiale" id="t-initiale"></span>
        <span><strong id="t-name"></strong><small id="t-teile"></small></span>
        <span data-symbol="ok"></span>
      </div>
      <div class="meldung" id="hinzufuegen-meldung" role="status"></div>
    </div>
    <footer class="blatt-fuss">
      <button type="button" class="knopf-rand" data-schliessen>Abbrechen</button>
      <button type="submit" class="knopf"><span data-symbol="personPlus"></span> Anfrage senden</button>
    </footer>
  </form>
</dialog>

<script>
  // So funktioniert diese Seite (Meine Freunde):
  // Oben die offenen Freundschaftsanfragen (Annehmen, Ablehnen, Blockieren), darunter die
  // Freundesliste mit Suche. Ein Klick auf einen Freund öffnet seinen Kleiderschrank.
  // „Freund hinzufügen“ öffnet ein Fenster, in dem man nach dem genauen Nutzernamen sucht.
  // Alles läuft noch mit Beispieldaten (beispieldaten.js), gespeichert wird nichts.
  seitenkopf("Meine Freunde");
  fussleiste([{ text: "Hauptmenü", symbol: "haus", href: "hauptmenue.html" }]);

  // Kopien der Beispiel-Listen, die sich beim Annehmen/Ablehnen ändern dürfen
  const ANFRAGEN = [...FREUNDSCHAFTSANFRAGEN_BEISPIEL];
  const FREUNDE = [...FREUNDE_BEISPIEL];

  // Runder Kreis mit dem Anfangsbuchstaben einer Person (z. B. „L“ für Lena)
  function initiale(person) {
    const el = document.createElement("span");
    el.className = `initiale ${person.ton}`;
    el.textContent = person.name[0];
    return el;
  }

  // Freundschaftsanfragen als Zeilen mit drei Knöpfen anzeigen. Jeder Knopf entfernt die Anfrage
  // aus der Liste (fertig), „Annehmen“ setzt die Person außerdem in die Freundesliste.
  function zeigeAnfragen() {
    const box = document.getElementById("anfragen");
    box.replaceChildren(...ANFRAGEN.map((p) => {
      const zeile = document.createElement("div");
      zeile.className = "anfrage";
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = p.name;
      const fertig = (text) => { ANFRAGEN.splice(ANFRAGEN.indexOf(p), 1); zeigeAnfragen(); zeigeMeldungKurz(text); };
      const annehmen = Object.assign(document.createElement("button"), { className: "knopf klein", textContent: "Annehmen", type: "button" });
      annehmen.onclick = () => { FREUNDE.push({ ...p, seit: "heute", teile: 0, outfits: 0, geliehen: 0, verliehen: 0 }); zeigeFreunde(); fertig(`${p.name} ist jetzt in deiner Freundesliste.`); };
      const ablehnen = Object.assign(document.createElement("button"), { className: "knopf-rand klein", textContent: "Ablehnen", type: "button" });
      ablehnen.onclick = () => fertig(`Anfrage von ${p.name} abgelehnt.`);
      const sperren = Object.assign(document.createElement("button"), { className: "symbolknopf", type: "button", innerHTML: SYMBOL.sperren });
      sperren.setAttribute("aria-label", `${p.name} blockieren`);
      sperren.onclick = () => fertig(`${p.name} blockiert.`);
      zeile.append(initiale(p), name, annehmen, ablehnen, sperren);
      return zeile;
    }));
    document.getElementById("anfragen-zahl").textContent = `${ANFRAGEN.length} neu`;
    document.getElementById("anfragen-karte").hidden = !ANFRAGEN.length;
  }

  // Erfolgsmeldung unter dem Hinweis-Kasten zeigen (den Meldungskasten beim ersten Mal anlegen)
  function zeigeMeldungKurz(text) {
    let el = document.getElementById("meldung");
    if (!el) {
      el = Object.assign(document.createElement("div"), { id: "meldung", role: "status" });
      document.querySelector(".hinweis").after(el);
    }
    zeigeMeldung(el, text, "ok");
  }

  // Ein Klick auf einen Freund öffnet direkt seinen Kleiderschrank, auf allen Bildschirmen
  // (Wunsch Katha, 24.11.2026; die Freund-Ansicht neben der Liste aus dem Desktop-Mockup entfällt).
  // Neu angenommene Freunde haben in den Beispieldaten keine eigene Seite, dann die Beispiele von Lena.
  const schrankAdresse = (p) => `freund-schrank.html?freund=${p.id || FREUNDE_BEISPIEL[0].id}`;

  // Freundesliste zeigen, gefiltert nach dem Suchwort; jeder Eintrag ist ein Link in den Kleiderschrank
  function zeigeFreunde() {
    const wort = document.getElementById("suche").value.trim().toLowerCase();
    const liste = document.getElementById("freunde");
    liste.replaceChildren(...FREUNDE.filter((p) => p.name.toLowerCase().includes(wort)).map((p) => {
      const li = document.createElement("li");
      const link = document.createElement("a");
      link.href = schrankAdresse(p);
      link.setAttribute("aria-label", `Kleiderschrank von ${p.name} ansehen`);
      link.append(initiale(p), p.name);
      link.insertAdjacentHTML("beforeend", `<span class="mehr">${SYMBOL.weiter}</span>`);
      li.append(link);
      return li;
    }));
    document.getElementById("freunde-zahl").textContent = `${FREUNDE.length} Freunde`;
  }

  // ---------- Freund hinzufügen: Suche über den genauen Nutzernamen (ERM, Abgleich mit den Mockups) ----------

  const hinzufuegen = document.getElementById("hinzufuegen-fenster");
  const hFormular = document.getElementById("hinzufuegen-formular");
  const hMeldung = document.getElementById("hinzufuegen-meldung");
  fensterVerdrahten(hinzufuegen);
  // der Nutzer, der zum eingegebenen Namen passt (null = noch keiner)
  let gefunden = null;

  // Fenster öffnen: vorher leeren
  document.getElementById("hinzufuegen").onclick = () => {
    hFormular.reset();
    gefunden = null;
    document.getElementById("treffer").hidden = true;
    hMeldung.textContent = "";
    hinzufuegen.showModal();
  };
  // Bei jeder Eingabe nachsehen, ob es genau diesen Nutzernamen gibt; wenn ja, den Treffer anzeigen
  hFormular.nutzername.oninput = () => {
    const name = hFormular.nutzername.value.trim();
    gefunden = NUTZER_BEISPIEL.find((n) => n.nutzername.toLowerCase() === name.toLowerCase()) || null;
    document.getElementById("treffer").hidden = !gefunden;
    hMeldung.textContent = "";
    if (!gefunden) return;
    const kreis = document.getElementById("t-initiale");
    kreis.className = `initiale ${gefunden.ton}`;
    kreis.textContent = gefunden.nutzername[0].toUpperCase();
    document.getElementById("t-name").textContent = gefunden.nutzername;
    document.getElementById("t-teile").textContent = `${gefunden.teile} geteilte Teile`;
  };
  // „Anfrage senden“: nur möglich, wenn ein Nutzer gefunden wurde
  hFormular.onsubmit = (e) => {
    e.preventDefault();
    if (!hFormular.nutzername.value.trim()) return zeigeMeldung(hMeldung, "Bitte einen Nutzernamen eingeben.", "fehler");
    if (!gefunden) return zeigeMeldung(hMeldung, "Niemand mit diesem Nutzernamen gefunden.", "fehler");
    hinzufuegen.close();
    zeigeMeldungKurz(`Anfrage an ${gefunden.nutzername} gesendet. Sobald sie angenommen ist, steht ${gefunden.nutzername} in deiner Freundesliste.`);
  };

  // Start: Suche verdrahten, Anfragen und Freundesliste anzeigen
  document.getElementById("suche").oninput = zeigeFreunde;
  zeigeAnfragen();
  zeigeFreunde();
</script>
</body>
</html>
