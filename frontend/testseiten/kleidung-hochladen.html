<!doctype html>
<!-- Wireframe 7 (Kleidungsstück hinzufügen), User Story 8. Speichert über POST /api/kleidung. -->
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sharely – Hinzufügen</title>
  <link rel="stylesheet" href="stil.css">
  <script src="gemeinsam.js"></script>
</head>
<body>
<main class="seite">
  <header class="kopf">
    <a class="zurueck" href="schrank.html" aria-label="Zurück zum Schrank" data-symbol="zurueck"></a>
    <h1>Hinzufügen</h1>
  </header>

  <form id="formular" novalidate>
    <div class="bildrahmen">
      <svg id="platzhalter" width="210" height="64" viewBox="0 0 210 64" aria-hidden="true">
        <rect x="1" y="1" width="208" height="62" fill="none" stroke="#9a9a9a"/>
        <circle cx="45" cy="17" r="7" fill="none" stroke="#9a9a9a"/>
        <path d="M1 63 L100 36 L209 63" fill="none" stroke="#9a9a9a"/>
      </svg>
      <img id="vorschau" alt="Vorschau des Fotos" hidden>
    </div>
    <div class="knopfreihe">
      <button type="button" class="knopf-rand klein" id="kamera-knopf">Foto aufnehmen</button>
      <button type="button" class="knopf-rand klein" id="galerie-knopf">Galerie</button>
    </div>
    <!-- capture öffnet auf dem Smartphone direkt die Kamera -->
    <input type="file" id="kamera" accept="image/*" capture="environment" hidden>
    <input type="file" id="galerie" accept="image/jpeg,image/png,image/webp" hidden>

    <span class="titel">Kategorie</span>
    <div class="pillen" id="kategorien"></div>

    <div class="schalter-zeile">
      <span class="titel">Favorit</span>
      <label class="schalter"><input type="checkbox" name="favorit" value="true" aria-label="Favorit"><span class="bahn"></span></label>
    </div>
    <div class="schalter-zeile">
      <span class="titel">Privat<small>Nur du siehst es, deine Freunde nicht</small></span>
      <label class="schalter"><input type="checkbox" name="privat" value="true" aria-label="Privat"><span class="bahn"></span></label>
    </div>

    <div class="zeile">
      <label><span class="titel">Größe</span><input type="text" name="groesse" maxlength="20" placeholder="z. B. M, 38"></label>
      <label><span class="titel">Marke</span><input type="text" name="marke" maxlength="50"></label>
    </div>
    <div class="zeile">
      <label><span class="titel">Farbe</span><input type="text" name="farbe" maxlength="50"></label>
      <label><span class="titel">Material</span><input type="text" name="material" maxlength="100" placeholder="z. B. Baumwolle"></label>
    </div>

    <span class="titel">Saison</span>
    <div class="pillen" id="saisons"></div>

    <span class="titel">Anlass</span>
    <div class="pillen" id="anlaesse"></div>

    <div class="zeile">
      <label><span class="titel">Preis (€)</span><input type="number" name="preis" min="0" step="0.01" inputmode="decimal"></label>
      <label><span class="titel">Kaufdatum</span><input type="date" name="kaufdatum" id="kaufdatum"></label>
    </div>

    <span class="titel">Herkunft</span>
    <div class="pillen" id="herkuenfte"></div>

    <label><span class="titel">Notiz</span><textarea name="notiz" maxlength="1000"></textarea></label>

    <button type="submit" class="knopf breit" id="speichern" style="margin-top: 24px">Speichern</button>
    <div id="meldung" class="meldung" role="status"></div>
  </form>
</main>

<script>
  function pillen(ziel, name, werte, typ) {
    const box = document.getElementById(ziel);
    for (const [wert, text] of Object.entries(werte)) {
      const label = document.createElement("label");
      label.innerHTML = `<input type="${typ}" name="${name}" value="${wert}"><span>${text}</span>`;
      box.append(label);
    }
  }
  pillen("kategorien", "kategorie", KATEGORIEN, "radio");
  pillen("saisons", "saison", SAISONS, "checkbox");
  pillen("anlaesse", "anlass", ANLAESSE, "checkbox");
  // Herkunft: Kästchen statt Radio, damit sie sich wieder abwählen lässt; höchstens eins aktiv
  pillen("herkuenfte", "herkunft", HERKUENFTE, "checkbox");
  document.getElementById("herkuenfte").onchange = (e) => {
    for (const f of document.querySelectorAll('[name="herkunft"]')) if (f !== e.target) f.checked = false;
  };

  document.getElementById("kaufdatum").max = new Date().toISOString().slice(0, 10);

  const formular = document.getElementById("formular");
  const vorschau = document.getElementById("vorschau");
  const platzhalter = document.getElementById("platzhalter");
  const meldung = document.getElementById("meldung");
  let bild = null;

  for (const id of ["kamera", "galerie"]) {
    const eingabe = document.getElementById(id);
    document.getElementById(id + "-knopf").onclick = () => eingabe.click();
    eingabe.onchange = () => {
      const datei = eingabe.files[0];
      eingabe.value = "";
      if (!datei) return;
      if (datei.size > MAX_BILD_MB * 1024 * 1024) {
        return zeigeMeldung(meldung, `Das Bild ist zu groß. Erlaubt sind höchstens ${MAX_BILD_MB} MB.`, "fehler");
      }
      bild = datei;
      meldung.textContent = "";
      vorschau.src = URL.createObjectURL(bild);
      vorschau.hidden = false;
      platzhalter.style.display = "none";
    };
  }

  formular.onsubmit = async (e) => {
    e.preventDefault();
    if (!bild) return zeigeMeldung(meldung, "Bitte zuerst ein Foto aufnehmen oder aus der Galerie wählen.", "fehler");
    if (!formular.kategorie.value) return zeigeMeldung(meldung, "Bitte eine Kategorie auswählen.", "fehler");

    const daten = new FormData();
    // leere Felder gar nicht erst schicken
    for (const [feld, wert] of new FormData(formular)) {
      if (wert.trim() !== "") daten.append(feld, wert);
    }
    daten.append("bild", bild);

    const knopf = document.getElementById("speichern");
    knopf.disabled = true;
    try {
      const antwort = await fetch(`${API}/kleidung`, { method: "POST", body: daten });
      const inhalt = await antwort.json();
      if (!antwort.ok) return zeigeMeldung(meldung, fehlerText(inhalt), "fehler");
      // Bestätigung zeigt der Schrank an
      location.href = `schrank.html?neu=${inhalt.kategorie}`;
    } catch {
      zeigeMeldung(meldung, "Keine Verbindung zum Backend. Läuft es auf Port 8000?", "fehler");
    } finally {
      knopf.disabled = false;
    }
  };
</script>
</body>
</html>
