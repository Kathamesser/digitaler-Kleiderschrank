<!doctype html>
<!-- Wireframe 13 (Verliehen). Beispieldaten: Das Modul verleihen hat noch kein Backend. -->
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sharely – Verliehen</title>
  <link rel="stylesheet" href="stil.css">
  <script src="gemeinsam.js"></script>
</head>
<body>
<main class="seite mit-navigation">
  <header class="kopfband">
    <h1>Verliehen</h1>
    <a href="profil.html" class="profilbild" aria-label="Mein Profil" data-symbol="person"></a>
  </header>

  <div class="umschalter" role="tablist">
    <button type="button" role="tab" data-ansicht="verliehen" class="aktiv" aria-selected="true">Verliehen</button>
    <button type="button" role="tab" data-ansicht="ausgeliehen" aria-selected="false">Ausgeliehen</button>
  </div>

  <div class="hinweis">Beispieldaten: Verleihen und Verschenken haben noch kein Backend.</div>
  <ul class="liste" id="liste"></ul>
</main>

<script>
  navigation("verliehen");

  // verliehen = meine Teile bei anderen, ausgeliehen = Teile anderer bei mir
  const BEISPIELE = {
    verliehen: [
      { titel: "Wintermantel", text: "an Lena · bis 15.10." },
      { titel: "Handtasche", text: "an Jonas · unbefristet" },
      { titel: "Jeans", text: "Anfrage von Mia · wartet" },
    ],
    ausgeliehen: [
      { titel: "Abendkleid", text: "von Sophie · bis 30.10." },
    ],
  };

  const liste = document.getElementById("liste");
  function zeige(ansicht) {
    for (const tab of document.querySelectorAll(".umschalter button")) {
      const aktiv = tab.dataset.ansicht === ansicht;
      tab.classList.toggle("aktiv", aktiv);
      tab.setAttribute("aria-selected", aktiv);
    }
    liste.replaceChildren(...BEISPIELE[ansicht].map(({ titel, text }) => {
      const li = document.createElement("li");
      li.className = "eintrag";
      li.innerHTML = `<span class="vorschau">${SYMBOL.bild}</span><span class="text"><strong></strong><span></span></span>`;
      li.querySelector("strong").textContent = titel;
      li.querySelector(".text span").textContent = text;
      return li;
    }));
  }
  for (const tab of document.querySelectorAll(".umschalter button")) tab.onclick = () => zeige(tab.dataset.ansicht);
  zeige("verliehen");
</script>
</body>
</html>
