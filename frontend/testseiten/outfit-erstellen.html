<!doctype html>
<!-- Wireframe 11 (Outfit erstellen). Kleidungsstücke live aus GET /api/kleidung;
     Speichern geht noch nicht, weil das Backend-Modul outfits fehlt. -->
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sharely – Outfit erstellen</title>
  <link rel="stylesheet" href="stil.css">
  <script src="gemeinsam.js"></script>
</head>
<body>
<main class="seite">
  <header class="kopf">
    <a class="zurueck" href="outfits.html" aria-label="Zurück zu den Outfits" data-symbol="zurueck"></a>
    <h1>Outfit erstellen</h1>
  </header>

  <form id="formular" novalidate>
    <label><span class="titel">Name des Outfits</span><input type="text" name="name" maxlength="100"></label>

    <label class="suche" style="margin: 16px 0 0">
      <span data-symbol="lupe"></span>
      <input type="search" id="suche" placeholder="Kleidungsstück suchen" aria-label="Kleidungsstück suchen">
    </label>

    <span class="titel">Kleidungsstücke auswählen</span>
    <div class="raster" id="raster"></div>

    <button type="submit" class="knopf breit" style="margin-top: 24px">Outfit speichern</button>
    <div id="meldung" class="meldung" role="status"></div>
  </form>
</main>

<script>
  const raster = document.getElementById("raster");
  const meldung = document.getElementById("meldung");
  const suche = document.getElementById("suche");
  const gewaehlt = new Set();
  let alle = [];

  function zeichne() {
    const wort = suche.value.trim().toLowerCase();
    const treffer = alle.filter((k) => !wort || titelVon(k).toLowerCase().includes(wort));
    raster.replaceChildren(...treffer.map((k) => {
      const karte = kleidungsKarte({ ...k, favorit: false, privat: false }, { link: false });
      karte.setAttribute("aria-pressed", gewaehlt.has(k.id));
      if (gewaehlt.has(k.id)) {
        karte.classList.add("gewaehlt");
        karte.querySelector(".kachel").insertAdjacentHTML("beforeend", `<span class="abzeichen rechts dunkel">${SYMBOL.haken}</span>`);
      }
      karte.onclick = () => { gewaehlt.has(k.id) ? gewaehlt.delete(k.id) : gewaehlt.add(k.id); zeichne(); };
      return karte;
    }));
    if (!alle.length) raster.innerHTML = '<p class="leise">Dein Schrank ist noch leer.</p>';
  }
  suche.oninput = zeichne;

  document.getElementById("formular").onsubmit = (e) => {
    e.preventDefault();
    const name = e.target.name.value.trim();
    if (!name) return zeigeMeldung(meldung, "Bitte dem Outfit einen Namen geben.", "fehler");
    if (gewaehlt.size < 2) return zeigeMeldung(meldung, "Bitte mindestens zwei Kleidungsstücke auswählen.", "fehler");
    zeigeMeldung(meldung, `„${name}“ mit ${gewaehlt.size} Teilen wäre jetzt gespeichert. Das Backend-Modul outfits fehlt noch.`, "ok");
  };

  holeJson("/kleidung")
    .then((liste) => { alle = liste; zeichne(); })
    .catch((fehler) => zeigeMeldung(meldung, fehler.message, "fehler"));
</script>
</body>
</html>
