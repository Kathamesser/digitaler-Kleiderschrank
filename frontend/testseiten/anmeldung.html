<!doctype html>
<!-- Wireframes 1 (Anmeldung) und 2 (Registrierung). Noch ohne Backend: Das Anmeldeverfahren ist offen. -->
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sharely – Anmelden</title>
  <link rel="stylesheet" href="stil.css">
  <script src="gemeinsam.js"></script>
</head>
<body>
<main class="seite">
  <div class="marke">
    <img src="../../assets/branding/sharely-logo.png" alt="Sharely-Logo">
    <strong>SHARELY</strong>
    <small>style and share</small>
  </div>

  <div class="umschalter" role="tablist">
    <button type="button" role="tab" id="tab-anmelden" class="aktiv" aria-selected="true">Anmelden</button>
    <button type="button" role="tab" id="tab-registrieren" aria-selected="false">Registrieren</button>
  </div>

  <div class="hinweis">Prototyp: Anmeldung und Registrierung prüfen noch nichts beim Backend und führen direkt zum Schrank.</div>

  <form id="anmelden" novalidate>
    <label><span class="titel">Nutzername</span><input type="text" name="nutzername" autocomplete="username" required></label>
    <label><span class="titel">Passwort</span><input type="password" name="passwort" autocomplete="current-password" required></label>
    <a class="link-klein" href="#" onclick="return false" title="Seite kommt noch">Passwort vergessen</a>
    <button type="submit" class="knopf breit" style="margin-top: 24px">Anmelden</button>
    <div class="meldung" role="status"></div>
  </form>

  <form id="registrieren" novalidate hidden>
    <label><span class="titel">E-Mail Adresse</span><input type="email" name="email" autocomplete="email" required></label>
    <label><span class="titel">Nutzername</span><input type="text" name="nutzername" autocomplete="username" required></label>
    <label><span class="titel">Passwort</span><input type="password" name="passwort" autocomplete="new-password" required></label>
    <label><span class="titel">Passwort wiederholen</span><input type="password" name="passwort2" autocomplete="new-password" required></label>
    <p class="leise">Mindestens 8 Zeichen, ein Sonderzeichen</p>
    <button type="submit" class="knopf breit" style="margin-top: 16px">Registrieren</button>
    <div class="meldung" role="status"></div>
  </form>
</main>

<script>
  const tabs = { anmelden: document.getElementById("tab-anmelden"), registrieren: document.getElementById("tab-registrieren") };
  function wechsle(ziel) {
    for (const [name, tab] of Object.entries(tabs)) {
      const aktiv = name === ziel;
      tab.classList.toggle("aktiv", aktiv);
      tab.setAttribute("aria-selected", aktiv);
      document.getElementById(name).hidden = !aktiv;
    }
  }
  tabs.anmelden.onclick = () => wechsle("anmelden");
  tabs.registrieren.onclick = () => wechsle("registrieren");

  document.getElementById("anmelden").onsubmit = (e) => {
    e.preventDefault();
    const f = e.target;
    if (!f.nutzername.value.trim() || !f.passwort.value) {
      return zeigeMeldung(f.querySelector(".meldung"), "Bitte Nutzername und Passwort eingeben.", "fehler");
    }
    location.href = "schrank.html"; // später: POST an das Modul nutzer
  };

  document.getElementById("registrieren").onsubmit = (e) => {
    e.preventDefault();
    const f = e.target;
    const meldung = f.querySelector(".meldung");
    if (!f.email.value.includes("@")) return zeigeMeldung(meldung, "Bitte eine gültige E-Mail-Adresse eingeben.", "fehler");
    if (!f.nutzername.value.trim()) return zeigeMeldung(meldung, "Bitte einen Nutzernamen wählen.", "fehler");
    if (f.passwort.value.length < 8 || !/[^A-Za-z0-9]/.test(f.passwort.value)) {
      return zeigeMeldung(meldung, "Das Passwort braucht mindestens 8 Zeichen und ein Sonderzeichen.", "fehler");
    }
    if (f.passwort.value !== f.passwort2.value) return zeigeMeldung(meldung, "Die Passwörter stimmen nicht überein.", "fehler");
    location.href = "schrank.html"; // später: POST an das Modul nutzer
  };
</script>
</body>
</html>
